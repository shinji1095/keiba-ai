services:
  reverse-proxy:
    image: nginx:1.27-alpine
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
    ports:
      - "80:80"
    depends_on:
      - api
      - frontend

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: services/api
    environment:
      TZ: ${TZ}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      # Pi 側 scraper-service(control API) の到達先（例: http://<pi-lan-ip>:8080）
      SCRAPER_CONTROL_BASE_URL: ${SCRAPER_CONTROL_BASE_URL}
      SCRAPER_FORWARD_TIMEOUT_SEC: ${SCRAPER_FORWARD_TIMEOUT_SEC}
    depends_on:
      - postgres

  api-sync-cron:
    build:
      context: services/api
    environment:
      TZ: ${TZ}
      SCRAPE_SYNC_CRON: ${SCRAPE_SYNC_CRON:-5 0 * * *}
      SCRAPE_SYNC_API_URL: ${SCRAPE_SYNC_API_URL:-http://api:8001}
    command: ["/app/cron/entrypoint.sh"]
    depends_on:
      - api
    volumes:
      - ./services/api/cron:/app/cron:ro

  worker:
    build:
      context: services/worker
    environment:
      TZ: ${TZ}
      API_BASE_URL: ${API_BASE_URL}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    depends_on:
      - postgres

  pipeline:
    build:
      context: services/pipeline
    environment:
      TZ: ${TZ}
      API_BASE_URL: ${API_BASE_URL}
    depends_on:
      - api

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.16.2
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      --default-artifact-root /mlartifacts
    environment:
      TZ: ${TZ}
    ports:
      - "5000:5000"
    volumes:
      - mlflow_artifacts:/mlartifacts
    depends_on:
      - postgres

  frontend:
    build:
      context: services/frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    ports:
      - "5173:5173"

volumes:
  postgres_data:
  mlflow_artifacts:
