[tool.ruff]
target-version = "py312"
line-length = 79

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "system: cross-service/system level tests (may require external services such as Pi scraper)",
]
