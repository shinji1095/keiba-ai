services:
  reverse-proxy:
    image: nginx:1.27-alpine
    volumes:
      - ../../infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../infra/nginx/conf.d:/etc/nginx/conf.d:ro
    ports:
      - "80:80"
    depends_on:
      - api
      - frontend

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-keiba}
      POSTGRES_USER: ${POSTGRES_USER:-keiba}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-keiba}
      TZ: ${TZ:-Asia/Tokyo}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ../../services/api
    environment:
      TZ: ${TZ:-Asia/Tokyo}
      POSTGRES_DB: ${POSTGRES_DB:-keiba}
      POSTGRES_USER: ${POSTGRES_USER:-keiba}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-keiba}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    depends_on:
      - postgres

  worker:
    build:
      context: ../../services/worker
    environment:
      TZ: ${TZ:-Asia/Tokyo}
      API_BASE_URL: ${API_BASE_URL:-http://api:8000}
      POSTGRES_DB: ${POSTGRES_DB:-keiba}
      POSTGRES_USER: ${POSTGRES_USER:-keiba}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-keiba}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    depends_on:
      - postgres

  pipeline:
    build:
      context: ../../services/pipeline
    environment:
      TZ: ${TZ:-Asia/Tokyo}
      API_BASE_URL: ${API_BASE_URL:-http://api:8000}
    depends_on:
      - api

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.16.2
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri postgresql://${POSTGRES_USER:-keiba}:${POSTGRES_PASSWORD:-keiba}@postgres:5432/${POSTGRES_DB:-keiba}
      --default-artifact-root /mlartifacts
    environment:
      TZ: ${TZ:-Asia/Tokyo}
    ports:
      - "5000:5000"
    volumes:
      - mlflow_artifacts:/mlartifacts
    depends_on:
      - postgres

  frontend:
    build:
      context: ../../services/frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    ports:
      - "5173:5173"

  scraper:
    build:
      context: ../../services/scraper
    environment:
      TZ: ${TZ:-Asia/Tokyo}
      PC_API_URL: ${PC_API_URL:-http://reverse-proxy/api}
    depends_on:
      - reverse-proxy

volumes:
  postgres_data:
  mlflow_artifacts:
