services:
  scraper:
    build:
      context: services/scraper
    environment:
      TZ: ${TZ}
      API_BASE_URL: ${PC_API_URL}
      API_ACCESS_TOKEN: ${API_ACCESS_TOKEN}
      SCRAPER_CONTROL_HOST: ${SCRAPER_CONTROL_HOST:-0.0.0.0}
      SCRAPER_CONTROL_PORT: ${SCRAPER_CONTROL_PORT:-8080}
    command: ["python", "-m", "scraper_service.control_server"]
    ports:
      - "${SCRAPER_CONTROL_PORT:-8080}:${SCRAPER_CONTROL_PORT:-8080}"
    volumes:
      - ./services/scraper/data:/app/data
      - ./services/scraper/src:/app/src
      - ./services/scraper/scrapy.cfg:/app/scrapy.cfg

  scraper-scheduler:
    build:
      context: services/scraper
    environment:
      TZ: ${TZ}
      API_BASE_URL: ${PC_API_URL}
      API_ACCESS_TOKEN: ${API_ACCESS_TOKEN}
    command: ["python", "-m", "scraper_service.scheduler.daemon"]
    volumes:
      - ./services/scraper/data:/app/data
      - ./services/scraper/src:/app/src
      - ./services/scraper/scrapy.cfg:/app/scrapy.cfg

  scraper-cron:
    build:
      context: services/scraper
    environment:
      TZ: ${TZ}
      API_BASE_URL: ${PC_API_URL}
      API_ACCESS_TOKEN: ${API_ACCESS_TOKEN}
      SCRAPER_CRON: ${SCRAPER_CRON:-*/2 * * * *}
      SCRAPER_CONTROL_URL: http://scraper:${SCRAPER_CONTROL_PORT:-8080}
    command: ["/app/cron/entrypoint.sh"]
    volumes:
      - ./services/scraper/data:/app/data
      - ./services/scraper/cron:/app/cron:ro
      - ./services/scraper/src:/app/src
      - ./services/scraper/scrapy.cfg:/app/scrapy.cfg

  scraper-health:
    build:
      context: services/scraper
    command: ["python", "-m", "scraper_service.health_server"]
    environment:
      TZ: ${TZ}
      SCRAPER_HEALTH_PORT: ${SCRAPER_HEALTH_PORT:-8081}
    ports:
      - "${SCRAPER_HEALTH_PORT:-8081}:${SCRAPER_HEALTH_PORT:-8081}"
