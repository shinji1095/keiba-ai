services:
  web:
    build:
      context: .
      dockerfile: services/frontend/Dockerfile
      target: production
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-keiba}
      POSTGRES_USER: ${POSTGRES_USER:-keiba}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-keiba}
      TZ: ${TZ:-Asia/Tokyo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: services/api
    environment:
      TZ: ${TZ:-Asia/Tokyo}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-keiba}:${POSTGRES_PASSWORD:-keiba}@postgres:5432/${POSTGRES_DB:-keiba}
      SECRET_KEY: ${SECRET_KEY:-change-me}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-adminpass}
      SCRAPER_CONTROL_BASE_URL: http://scraper:8080
      SCRAPER_FORWARD_TIMEOUT_SEC: ${SCRAPER_FORWARD_TIMEOUT_SEC:-300}
      SCRAPE_SYNC_STATE_PATH: /app/data/sync_state.json
      SCRAPE_SYNC_CRON: ${SCRAPE_SYNC_CRON:-5 0 * * *}
      SCRAPE_SYNC_API_URL: http://127.0.0.1:8001
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_MODEL_NAME: ${MLFLOW_MODEL_NAME:-keiba_win_classifier}
      MLFLOW_MODEL_STAGE: ${MLFLOW_MODEL_STAGE:-Production}
      MLFLOW_MODEL_CACHE_TTL_SEC: ${MLFLOW_MODEL_CACHE_TTL_SEC:-300}
    volumes:
      - api_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      scraper:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  scraper:
    build: services/scraper
    environment:
      TZ: ${TZ:-Asia/Tokyo}
    volumes:
      - ./services/scraper/data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 5
    restart: unless-stopped

  mlflow:
    profiles: [ml, training]
    build: services/mlflow
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - postgresql://${POSTGRES_USER:-keiba}:${POSTGRES_PASSWORD:-keiba}@postgres:5432/${POSTGRES_DB:-keiba}
      - --serve-artifacts
      - --artifacts-destination
      - /mlartifacts
      - --default-artifact-root
      - mlflow-artifacts:/
    environment:
      TZ: ${TZ:-Asia/Tokyo}
    ports:
      - "127.0.0.1:${MLFLOW_PORT:-5000}:5000"
    volumes:
      - mlflow_artifacts:/mlartifacts
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 30s

  pipeline:
    profiles: [training]
    build: services/pipeline
    environment:
      TZ: ${TZ:-Asia/Tokyo}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-keiba}:${POSTGRES_PASSWORD:-keiba}@postgres:5432/${POSTGRES_DB:-keiba}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_EXPERIMENT_NAME: ${MLFLOW_EXPERIMENT_NAME:-keiba-win-v1}
      MLFLOW_MODEL_NAME: ${MLFLOW_MODEL_NAME:-keiba_win_classifier}
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy

volumes:
  postgres_data:
  api_data:
  mlflow_artifacts:
