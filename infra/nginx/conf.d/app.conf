server {
  listen 80;
  # Docker embedded DNS
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Frontend
  location / {
    # Use a variable to force runtime DNS resolution (container IP may change on recreate)
    set $frontend_upstream http://frontend:5173;
    proxy_pass $frontend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # Vite HMR (WebSocket)
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  # API
  location /api/ {
    # Use a variable to force runtime DNS resolution (container IP may change on recreate)
    # NOTE: variable proxy_pass does NOT perform the automatic "/api/" -> "/" rewrite,
    # so we rewrite explicitly.
    set $api_upstream http://api:8001;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
