server {
  listen 80;
  # Docker embedded DNS
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Frontend
  location / {
    # Use a variable to force runtime DNS resolution (container IP may change on recreate)
    set $frontend_upstream http://frontend:5173;
    proxy_pass $frontend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # API
  location /api/ {
    # Keep static proxy_pass with trailing slash so "/api/xxx" -> "/xxx" is rewritten.
    # (variable proxy_pass is avoided here because it changes rewrite semantics and is brittle)
    proxy_pass http://api:8000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
