        horse_name:
          type: string
        jockey_name:
          type: string
          nullable: true
        trainer_name:
          type: string
          nullable: true
        handicap_kg:
          type: number
          format: float
          nullable: true
        body_weight:
          type: integer
          format: int32
          nullable: true
        body_weight_diff:
          type: integer
          format: int32
          nullable: true

    RaceEntryListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RaceEntry"

    RaceEntryWithRace:
      type: object
      required: [race_entry_id, race_id, race_key, horse_number, horse_name]
      properties:
        race_entry_id:
