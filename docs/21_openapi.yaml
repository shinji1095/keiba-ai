          type: string
          format: date
        baba_code:
          type: integer
          format: int32
        race_no:
          type: integer
          format: int32
        post_time:
          type: string
          format: time
          nullable: true
        race_name:
          type: string
        surface:
          type: string
          nullable: true
        distance_m:
          type: integer
          format: int32
          nullable: true
        direction:
