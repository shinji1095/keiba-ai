        race_key:
          $ref: "#/components/schemas/RaceKey"
        start_time:
          type: string
          format: time
          nullable: true
        race_name:
          type: string
          nullable: true
        status:
          type: string
          nullable: true
        horse_id:
          type: integer
          format: int64
          nullable: true
        post_position:
          type: integer
          format: int32
          nullable: true
        horse_number:
          type: integer
          format: int32
        horse_name:
          type: string
        jockey_name:
          type: string
          nullable: true
        trainer_name:
          type: string
          nullable: true
        handicap_kg:
          type: number
          format: float
          nullable: true
        body_weight:
          type: integer
          format: int32
          nullable: true
        body_weight_diff:
          type: integer
          format: int32
          nullable: true

    RaceEntryWithRaceListResponse:
      type: object
      required: [items, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RaceEntryWithRace"
        page:
