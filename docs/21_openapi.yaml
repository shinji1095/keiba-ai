openapi: 3.0.3
info:
  title: Keiba AI API
  version: 0.2.0
  description: |
    競馬AI（keiba.go.jp 由来データのスクレイピング → DB 蓄積 → 参照）のAPI。

    - 本リリースのスコープ: reverse-proxy / api-service / scraper-service / postgres
    - スコープ外: pipeline-service(Prefect), worker-service(Celery), MLflow

    ## Authentication (JWT)
    - Access Token: JWT（短命 15分）を `Authorization: Bearer <token>` で送信
    - Refresh Token: JWT（長命 30日）を HttpOnly Cookie（`refresh_token`）に保存
      - Rotation: refresh のたびに refresh token を更新（毎回更新）
      - Revocation: Redis で失効管理（jti ベース想定）

    ## Scraper authentication (reserved)
    - api-service ⇔ scraper-service 間は **認証不要**（将来のアップデートで対応予定）
    - client_credentials フローは将来予約（後方互換で有効化）
    - 将来的に **mTLS を導入予定**（現時点は未対応）
servers:
  - url: /api
tags:
  - name: health
  - name: auth
  - name: admin
  - name: venues
  - name: races
  - name: scrape
  - name: spec

paths:
  /health:
    get:
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /auth/login:
    post:
      tags: [auth]
      summary: Login (password) and set refresh cookie
      description: |
        認証に成功すると access token を返し、refresh token は HttpOnly Cookie に `Set-Cookie` で格納する。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordLoginRequest"
      responses:
        "200":
          description: OK
          headers:
            Set-Cookie:
              description: HttpOnly refresh token cookie (refresh_token)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/register:
    post:
      tags: [auth]
      summary: Register user and set refresh cookie
      description: |
        ユーザーを新規作成し、access token を返す。
        refresh token は HttpOnly Cookie に `Set-Cookie` で格納する。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRegisterRequest"
      responses:
        "201":
          description: Created
          headers:
            Set-Cookie:
              description: HttpOnly refresh token cookie (refresh_token)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /auth/refresh:
    post:
      tags: [auth]
      summary: Refresh access token (rotate refresh cookie)
      description: |
        refresh token は `refresh_token` Cookie から読み取る。
        成功時に新しい refresh token を `Set-Cookie` で返す（ローテーション）。
      parameters:
        - in: cookie
          name: refresh_token
          required: true
          schema:
            type: string
          description: HttpOnly refresh token cookie (JWT)
      responses:
        "200":
          description: OK
          headers:
            Set-Cookie:
              description: Rotated HttpOnly refresh token cookie (refresh_token)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/logout:
    post:
      tags: [auth]
      summary: Logout (revoke refresh token and clear cookie)
      description: |
        refresh token を失効させ、Cookie を削除する。
      parameters:
        - in: cookie
          name: refresh_token
          required: false
          schema:
            type: string
          description: HttpOnly refresh token cookie (JWT)
      responses:
        "204":
          description: No Content
          headers:
            Set-Cookie:
              description: Clear refresh_token cookie
              schema:
                type: string

  /auth/token:
    post:
      tags: [auth]
      summary: Issue access token by client_credentials (future reservation)
      description: |
        client_credentials による access token 発行の将来予約。
        現在の api-service ⇔ scraper-service は無認証で運用するため、本エンドポイントは未使用。
        refresh cookie は発行しない。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientCredentialsTokenRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/oauth-clients:
    post:
      tags: [admin]
      summary: Create OAuth client (future reservation)
      description: |
        client_credentials 用のクライアントを作成する（将来予約）。
        client_secret は作成時（およびローテーション時）にのみ返す想定。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OAuthClientCreateRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthClientCreateResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    get:
      tags: [admin]
      summary: List OAuth clients
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: page_size
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthClientListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/oauth-clients/{client_id}:
    patch:
      tags: [admin]
      summary: Update OAuth client (scopes/active)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: client_id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OAuthClientUpdateRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthClientView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [admin]
      summary: Revoke OAuth client
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: client_id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/oauth-clients/{client_id}/rotate-secret:
    post:
      tags: [admin]
      summary: Rotate client_secret (return new secret once)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: client_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthClientRotateSecretResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /venues:
    get:
      tags: [venues]
      summary: List venues
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenueListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /races:
    get:
      tags: [races]
      summary: List races by race_date/baba_code
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: race_date
          required: true
          schema:
            type: string
            format: date
        - in: query
          name: baba_code
          required: false
          schema:
            type: integer
            format: int32
        - in: query
          name: page
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: page_size
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RaceListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /races/{race_id}:
    get:
      tags: [races]
      summary: Get race
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: race_id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Race"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /races/{race_id}/entries:
    get:
      tags: [races]
      summary: List race entries
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: race_id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RaceEntryListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /race-entries:
    get:
      tags: [races]
      summary: List race entries by race_date/baba_code
      description: |
        指定日の出走表（race_entries）を一覧する。
        当日/過去レースページ向けに、race 情報（race_key/start_time等）も含めて返す。
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: race_date
          required: true
          schema:
            type: string
            format: date
        - in: query
          name: baba_code
          required: false
          schema:
            type: integer
            format: int32
        - in: query
          name: page
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: page_size
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 200
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RaceEntryWithRaceListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /race-entry-results:
    get:
      tags: [races]
      summary: List race entries with results by race_date/baba_code
      description: |
        指定日の出走表（race_entries）を一覧し、可能であれば確定成績（race_results）も結合して返す。
        過去レースの一覧（馬体重/騎手/成績を1画面で確認）向け。
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: race_date
          required: true
          schema:
            type: string
            format: date
        - in: query
          name: baba_code
          required: false
          schema:
            type: integer
            format: int32
        - in: query
          name: page
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: page_size
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 200
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RaceEntryResultWithRaceListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /races/{race_id}/odds:
    get:
      tags: [races]
      summary: Get odds snapshot items for a race
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: race_id
          required: true
          schema:
            type: integer
            format: int64
        - in: query
          name: snapshot_kind
          required: true
          schema:
            $ref: "#/components/schemas/SnapshotKind"
        - in: query
          name: bet_type
          required: true
          schema:
            $ref: "#/components/schemas/BetType"
        - in: query
          name: odds_flg
          required: false
          schema:
            type: integer
            nullable: true
          description: |
            表示モード（馬番順/人気順/マトリクス等）。時刻指定ではない。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OddsSnapshotQueryResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /races/{race_id}/results:
    get:
      tags: [races]
      summary: List race results
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: race_id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RaceResultListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /races/{race_id}/payouts:
    get:
      tags: [races]
      summary: List payouts
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: race_id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayoutListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /scrape/manual-tasks:
    post:
      tags: [scrape]
      summary: Request manual scrape task
      description: |
        frontend などから手動スクレイプを依頼する。
        `race_date` を省略した場合は当日（JST）を対象とする。
        api-service は Pi 側へ手動実行を指示する。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManualScrapeTaskRequest"
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManualScrapeTaskResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /scrape/schedule:
    get:
      tags: [scrape]
      summary: Get scrape schedule status
      description: |
        定期実行のオン/オフ状態と対象競馬場、odds の snapshot_kinds を返す。
        cron コンテナは本状態に従って実行する。
        認証不要（PC 経由の内部通信を想定）
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScrapeScheduleStatus"
    post:
      tags: [scrape]
      summary: Update scrape schedule
      description: |
        定期実行のオン/オフと対象競馬場、odds の snapshot_kinds を更新する。
        api-service が scraper-service の control API へ反映する。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScrapeScheduleUpdateRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScrapeScheduleStatus"

  /scrape/plan:
    get:
      tags: [scrape]
      summary: Get scrape execution plan
      description: |
        scraper-service（Pi）が生成した当日プラン（scrape_plan_YYYY-MM-DD.json）を取得する。
        `race_date` を省略した場合は当日（JST）を対象とする。
      parameters:
        - name: race_date
          in: query
          required: false
          schema:
            type: string
            example: 2026-01-02
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScrapePlan"
        "404":
          $ref: "#/components/responses/NotFound"

  /scrape/sync:
    post:
      tags: [scrape]
      summary: Trigger manual sync
      description: |
        差分同期（fingerprint ベース）を手動で開始する。
        api-service が scraper-service から pull し、PC 側へ取り込む。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScrapeSyncRequest"
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScrapeSyncResponse"

  /scrape/sync/scheduled:
    post:
      tags: [scrape]
      summary: Trigger scheduled sync
      description: |
        定期同期（JST 1日おき）を cron からトリガする。
        api-service が scraper-service から pull し、スケジュールが無効または未到来の場合はスキップする。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScrapeSyncRequest"
      responses:
        "200":
          description: Skipped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScrapeSyncResponse"
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScrapeSyncResponse"

  /scrape/sync/schedule:
    post:
      tags: [scrape]
      summary: Update sync schedule
      description: |
        定期同期の有効/無効と interval_days を更新する。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScrapeSyncScheduleRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScrapeSyncStatus"

  /scrape/sync/status:
    get:
      tags: [scrape]
      summary: Get sync status
      description: |
        定期同期（JST 1日おき）と差分同期（Pi → PC pull）の状態を返す。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScrapeSyncStatus"

  /scrape/races:
    post:
      tags: [scrape]
      summary: Upsert races (RaceList)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RaceUpsertBatchRequest"
      responses:
        "201":
          description: Created/Upserted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchUpsertResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /scrape/race-entries:
    post:
      tags: [scrape]
      summary: Upsert race entries (DebaTable)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RaceEntryUpsertBatchRequest"
      responses:
        "201":
          description: Created/Upserted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchUpsertResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /scrape/odds-snapshots:
    post:
      tags: [scrape]
      summary: Upsert odds snapshots and items
      description: |
        オッズは発走時刻基準の `snapshot_kind`（t_minus_60m / t_minus_30m / t_minus_20m / t_minus_10m / t_minus_5m / t_minus_1m / final）でスナップショット保存する。
        手動取得は `captured_at` と `races.start_time` から最も近い `snapshot_kind` を割り当てる（`captured_at >= races.start_time` は `final`）。
        同一 `race_key × bet_type × snapshot_kind × odds_flg` は 1件として上書きする。
        `snapshot_kind` は運用で拡張可能（OpenAPI では固定 enum としない）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OddsSnapshotUpsertRequest"
      responses:
        "201":
          description: Created/Upserted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OddsSnapshotUpsertResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /scrape/race-results:
    post:
      tags: [scrape]
      summary: Upsert race results (RaceMarkTable)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RaceResultUpsertBatchRequest"
      responses:
        "201":
          description: Created/Upserted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchUpsertResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /scrape/payouts:
    post:
      tags: [scrape]
      summary: Upsert payouts (RefundMoneyList)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayoutUpsertBatchRequest"
      responses:
        "201":
          description: Created/Upserted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchUpsertResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /scrape/race-changes:
    post:
      tags: [scrape]
      summary: Insert race changes (cancel/jockey change etc.)
      description: |
        将来予約（本リリースではスコープ外）。
        現時点の scraper → api 同期では通常利用しない（race_changes の収集/同期は将来対応）。
      deprecated: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RaceChangeInsertBatchRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchUpsertResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /spec/race-cards/{baba_code}/{race_date}/{race_no}:
    get:
      tags: [spec]
      summary: Get spec race card (DebaTable normalized)
      description: |
        出馬表（DebaTable）由来の正規化データ（馬/人/着別成績/最高タイム/直近5走）を返す。
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: baba_code
          required: true
          schema:
            type: integer
            format: int32
            minimum: 1
          description: 競馬場コード
        - in: path
          name: race_date
          required: true
          schema:
            type: string
            format: date
          description: YYYY-MM-DD (JST)
        - in: path
          name: race_no
          required: true
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 12
          description: レース番号
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpecRaceCardResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

  schemas:
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: bad_request
            message:
              type: string
              example: invalid payload
            details:
              type: object
              additionalProperties: true

    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok

    # -------------------------
    # Auth
    # -------------------------
    PasswordLoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password

    UserRegisterRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 255
        password:
          type: string
          format: password
          minLength: 1

    ClientCredentialsTokenRequest:
      type: object
      required: [grant_type, client_id, client_secret]
      properties:
        grant_type:
          type: string
          enum: [client_credentials]
        client_id:
          type: string
        client_secret:
          type: string
          format: password
        scope:
          type: string
          nullable: true
          description: Space separated scopes (optional)
          example: "scrape:write"

    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token:
          type: string
          description: JWT access token
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          description: seconds
          example: 900
        issued_at:
          type: string
          format: date-time
          nullable: true

    # -------------------------
    # Common keys / enums
    # -------------------------
    RaceKey:
      type: object
      required: [race_date, baba_code, race_no]
      properties:
        race_date:
          type: string
          format: date
        baba_code:
          type: integer
          format: int32
          description: 競馬場コード
          example: 20
        race_no:
          type: integer
          format: int32
          minimum: 1
          maximum: 12
          example: 3

    BetType:
      type: string
      enum:
        - tansho
        - fukusho
        - wakuren
        - wakutan
        - umaren
        - umatan
        - wide
        - sanrenpuku
        - sanrentan

    SnapshotKind:
      type: string
      description: |
        代表オッズ時点（デフォルト: t_minus_60m / t_minus_30m / t_minus_20m / t_minus_10m / t_minus_5m / t_minus_1m / final）。
        運用で拡張可能なため、未知の値も許容する。
      example: t_minus_10m

    # -------------------------
    # Scrape control / sync
    # -------------------------
    ManualScrapeTaskRequest:
      type: object
      required: [baba_code]
      properties:
        race_date:
          type: string
          format: date
          description: YYYY-MM-DD (JST). Omit to use today (JST).
          nullable: true
        baba_code:
          type: integer
          format: int32
          description: 競馬場コード
        race_no:
          type: integer
          format: int32
          minimum: 1
          maximum: 12
          nullable: true
        reason:
          type: string
          nullable: true

    ManualScrapeTaskResponse:
      type: object
      required: [task_id, status, accepted_at]
      properties:
        task_id:
          type: string
        status:
          type: string
          example: accepted
        accepted_at:
          type: string
          format: date-time

    ScrapeScheduleStatus:
      type: object
      required: [enabled, updated_at]
      properties:
        enabled:
          type: boolean
        baba_codes:
          type: array
          items:
            type: integer
            format: int32
          description: 定期実行の対象競馬場コード（複数指定）
          nullable: true
        snapshot_kinds:
          type: array
          items:
            type: string
          description: odds の取得タイミング（複数指定可）。未設定時は final のみ。
          nullable: true
        prefetch_days:
          type: integer
          minimum: 0
          maximum: 31
          description: 日次で先読みする RaceList の日数（0で無効）
          nullable: true
        mode:
          type: string
          nullable: true
        updated_at:
          type: string
          format: date-time
        note:
          type: string
          nullable: true

    ScrapeScheduleUpdateRequest:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
        baba_codes:
          type: array
          items:
            type: integer
            format: int32
          description: 定期実行の対象競馬場コード（複数指定）
          nullable: true
        snapshot_kinds:
          type: array
          items:
            type: string
          description: odds の取得タイミング（複数指定可）。未設定時は final のみ。
          nullable: true
        prefetch_days:
          type: integer
          minimum: 0
          maximum: 31
          description: 日次で先読みする RaceList の日数（0で無効）
          nullable: true

    ScrapePlanKey:
      type: object
      required: [race_date, baba_code]
      properties:
        race_date:
          type: string
          example: 2026-01-02
        baba_code:
          type: integer
          format: int32
        race_no:
          type: integer
          format: int32
          nullable: true

    ScrapePlanItem:
      type: object
      required: [task_kind, page_name, race_key, snapshot_kind, target_at, scheduled_at, priority, within_tolerance, delay_sec]
      properties:
        task_kind:
          type: string
          example: odds
        page_name:
          type: string
          example: OddsTanFuku
        race_key:
          $ref: "#/components/schemas/ScrapePlanKey"
        start_time:
          type: string
          description: HH:MM:SS
          nullable: true
        snapshot_kind:
          type: string
        odds_flg:
          type: integer
          format: int32
          nullable: true
        target_at:
          type: string
          format: date-time
        scheduled_at:
          type: string
          format: date-time
        priority:
          type: integer
        within_tolerance:
          type: boolean
        delay_sec:
          type: integer

    ScrapePlan:
      type: object
      required: [race_date, snapshot_kinds, generated_at, interval_sec, tolerance_sec, items]
      properties:
        race_date:
          type: string
          example: 2026-01-02
        snapshot_kinds:
          type: array
          items:
            type: string
        generated_at:
          type: string
          format: date-time
        interval_sec:
          type: integer
        tolerance_sec:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/ScrapePlanItem"

    ScrapeSyncRequest:
      type: object
      properties:
        reason:
          type: string
          nullable: true

    ScrapeSyncScheduleRequest:
      type: object
      required: [enabled, interval_days]
      properties:
        enabled:
          type: boolean
        interval_days:
          type: integer
          minimum: 1
          example: 2
        diff_enabled:
          type: boolean
          nullable: true

    ScrapeSyncResponse:
      type: object
      required: [sync_id, status, started_at]
      properties:
        sync_id:
          type: string
        status:
          type: string
          example: accepted
        started_at:
          type: string
          format: date-time

    ScrapeSyncStatus:
      type: object
      required: [enabled, interval_days, diff_enabled]
      properties:
        enabled:
          type: boolean
        interval_days:
          type: integer
          minimum: 1
          example: 2
        diff_enabled:
          type: boolean
        last_synced_at:
          type: string
          format: date-time
          nullable: true
        next_scheduled_at:
          type: string
          format: date-time
          nullable: true
        last_fingerprint:
          type: string
          nullable: true
        last_attempted_at:
          type: string
          format: date-time
          nullable: true
        last_status:
          type: string
          nullable: true
        last_error:
          type: string
          nullable: true
        last_trigger:
          type: string
          nullable: true
        schedule_updated_at:
          type: string
          format: date-time
          nullable: true

    # -------------------------
    # Admin: OAuth Clients
    # -------------------------
    OAuthClientCreateRequest:
      type: object
      required: [name, scopes]
      properties:
        name:
          type: string
          example: scraper-prod
        scopes:
          type: array
          items:
            type: string
          example: ["scrape:write"]
        is_active:
          type: boolean
          default: true

    OAuthClientCreateResponse:
      type: object
      required: [client]
      properties:
        client:
          $ref: "#/components/schemas/OAuthClientWithSecret"

    OAuthClientRotateSecretResponse:
      type: object
      required: [client]
      properties:
        client:
          $ref: "#/components/schemas/OAuthClientWithSecret"

    OAuthClientUpdateRequest:
      type: object
      properties:
        scopes:
          type: array
          items:
            type: string
          nullable: true
        is_active:
          type: boolean
          nullable: true

    OAuthClientListResponse:
      type: object
      required: [items, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/OAuthClientView"
        page:
          type: integer
        page_size:
          type: integer

    OAuthClientView:
      type: object
      required: [client_id, name, scopes, is_active, created_at]
      properties:
        client_id:
          type: string
        name:
          type: string
        scopes:
          type: array
          items:
            type: string
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
          nullable: true

    OAuthClientWithSecret:
      allOf:
        - $ref: "#/components/schemas/OAuthClientView"
        - type: object
          required: [client_secret]
          properties:
            client_secret:
              type: string
              format: password
              description: Returned only once

    # -------------------------
    # Facts: venues / races
    # -------------------------
    Venue:
      type: object
      required: [baba_code, venue_name]
      properties:
        baba_code:
          type: integer
          format: int32
        venue_name:
          type: string

    VenueListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Venue"

    Race:
      type: object
      required: [race_id, race_key]
      properties:
        race_id:
          type: integer
          format: int64
        race_key:
          $ref: "#/components/schemas/RaceKey"
        start_time:
          type: string
          format: time
          nullable: true
        distance_m:
          type: integer
          format: int32
          nullable: true
        course:
          type: string
          nullable: true
        weather:
          type: string
          nullable: true
        track_condition:
          type: string
          nullable: true
        race_name:
          type: string
          nullable: true
        field_size:
          type: integer
          format: int32
          nullable: true
        status:
          type: string
          nullable: true

    RaceSummary:
      type: object
      required: [race_id, race_key]
      properties:
        race_id:
          type: integer
          format: int64
        race_key:
          $ref: "#/components/schemas/RaceKey"
        start_time:
          type: string
          format: time
          nullable: true
        race_name:
          type: string
          nullable: true
        status:
          type: string
          nullable: true

    RaceListResponse:
      type: object
      required: [items, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RaceSummary"
